services:
  - type: web
    name: medi-truth-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    # Render sets $PORT env var; make the app listen on it
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"

  - type: web
    name: medi-truth-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    # Frontend Nginx serves on $PORT automatically
    startCommand: ""
    staticPublishPath: "/usr/share/nginx/html"
